<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포인트 충전</title>
    <link rel="stylesheet" href="./css/payment-page.css">
</head>
<body>
    <div class="header">
        <div class="title">슈퍼링크</div>
        <div>P 10,000</div>
    </div>

    <div class="container">
        <h1>포인트 충전</h1>
        <div class="pricing">
            <h2>서비스별 이용 금액 안내</h2>
            <div class="price-box">
                <h3>베이직</h3>
                <p>방문자 ~299명</p>
                <strong>₩10,000/명</strong>
            </div>
            <div class="price-box">
                <h3>프리미엄</h3>
                <p>방문자 300~999명</p>
                <strong>₩20,000/명</strong>
            </div>
            <div class="price-box">
                <h3>엘리트</h3>
                <p>방문자 1,000명 이상</p>
                <strong>₩30,000/명</strong>
            </div>
        </div>

        <div class="balance">
            <h3>현재 잔액: 10,000 P</h3>
            <p>(1 포인트 = 1원)</p>
        </div>

        <div class="payment-options">
            <h2>충전할 금액 선택</h2>
            <button class="btn">10만원</button>
            <button class="btn">30만원</button>
            <button class="btn">100만원</button>
            <button class="btn">직접 입력</button>
            <h2>결제 방법</h2>
            <button class="btn">신용카드</button>
            <button class="btn">계좌이체</button>
            <button class="btn">자동이체</button>
            <button class="btn">간편결제</button>
        </div>

        <a href="#" class="btn">충전하기</a>
    </div>
</body>
</html>
