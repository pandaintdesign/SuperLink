<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Status</title>
    <link rel="stylesheet" href="./css/campaign-status.css">
 </head>
<body>
    <div class="container">
        <div class="header">캠페인 진행 현황</div>
        <div class="section">
            <h3>모집 현황</h3>
            <div class="progress-bar">
                <div class="progress" style="width: 70%;"></div>
            </div>
            <p>10/20 (70%)</p>
        </div>
        <div class="section">
            <h3>제품 발송</h3>
            <div class="progress-bar">
                <div class="progress" style="width: 40%;"></div>
            </div>
            <p>8/20 (40%)</p>
        </div>
        <div class="section">
            <h3>포스팅 현황</h3>
            <table class="status-table">
                <tr>
                    <th>블로거명</th>
                    <th>지수</th>
                    <th>이름</th>
                    <th>전화번호</th>
                    <th>주소</th>
                    <th>택배사</th>
                    <th>송장번호</th>
                </tr>
                <tr>
                    <td>블로거A</td>
                    <td>87</td>
                    <td>김OO</td>
                    <td>010-****-1234</td>
                    <td>서울시 강남구</td>
                    <td>CJ대한통운</td>
                    <td>123456789</td>
                </tr>
                <tr>
                    <td>블로거B</td>
                    <td>92</td>
                    <td>이OO</td>
                    <td>010-****-5678</td>
                    <td>경기도 성남시</td>
                    <td>롯데택배</td>
                    <td>987654321</td>
                </tr>
                <tr>
                    <td>블로거C</td>
                    <td>78</td>
                    <td>박OO</td>
                    <td>010-****-9012</td>
                    <td>서울시 서초구</td>
                    <td>택배사 선택</td>
                    <td>입력</td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
