<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | 슈퍼링크</title>
    <link rel="stylesheet" href="./css/signup-page.css">
</head>
<body>
    <div class="container">
        <div class="title">회원가입</div>
        <div class="subtitle">슈퍼링크 마케팅 플랫폼에 오신 것을 환영합니다</div>
        
        <div class="form-group">
            <label>이메일 <span style="color:#ff6600">* 인증 필수</span></label>
            <input type="email" placeholder="your@email.com">
        </div>
        
        <div class="form-group">
            <label>비밀번호 <span style="color:#ff6600">* 필수</span></label>
            <input type="password" placeholder="8자 이상, 영문, 숫자, 특수문자 포함">
        </div>
        
        <div class="form-group">
            <label>비밀번호 확인 <span style="color:#ff6600">* 필수</span></label>
            <input type="password">
        </div>
        
        <div class="form-group">
            <label>이름 <span style="color:#ff6600">* 필수</span></label>
            <input type="text">
        </div>
        
        <div class="form-group">
            <label>연락처 <span style="color:#ff6600">* 필수</span></label>
            <input type="text" placeholder="010-0000-0000">
        </div>
        
        <div class="form-group">
            <label>기업명 <span style="color:#ff6600">* 필수</span></label>
            <input type="text">
        </div>
        
        <div class="form-group">
            <label>사업자 등록번호 <span style="color:#ff6600">* 필수</span></label>
            <input type="text" placeholder="000-00-00000">
        </div>
        
        <button class="button">가입하기</button>
        
        <p>이미 계정이 있으신가요? <a href="#" class="link">로그인</a></p>
    </div>
</body>
</html>
