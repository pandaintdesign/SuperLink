<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>슈퍼링크 캠페인 진행 현황</title>
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/command.css" />
    <link rel="stylesheet" href="./css/campaign-detail.css" />
    <link rel="stylesheet" href="./css/quick.css" />
    <link rel="stylesheet" href="./css/page.css" />
    <link rel="stylesheet" href="./css/footer.css" />
  </head>
  <body>
    <!-- 헤더 -->
    <div id="header"></div>

    <section id="campaign-detail" class="campaign-detail">
      <div class="campaign-detail-wrap">
        <h3>진행현황</h3>

        <!-- 캠페인 리스트 -->
        <div class="campaignList">
          <h4 class="subTitle">캠페인 내역</h4>
          <table class="ListTable campaignTablelist">
            <thead class="columnLine columnBox">
              <tr>
                <th>캠페인 명</th>
                <th>기간</th>
                <th>진행현황</th>
              </tr>
            </thead>
            <tbody class="rowBox">
              <!-- 서버에서 받은 리스트를 JS로 렌더링 -->
            </tbody>
          </table>
          <button type="button" class="moreView">더보기&gt;</button>
        </div>

        <!-- 상세내역 -->
        <div class="subTitle">
          <h4 class="userName sectionTitle">
            <span class="brandName">브랜드명</span> |
            <span class="bloggerCategory">체험단</span>
          </h4>
        </div>

        <div class="stateBox">
          <div class="stateList">
            <ul>
              <li>
                진행기간
                <span class="runningDate">2025-06-17 ~ 2025-07-01</span>
              </li>
              <li>모집인원<span class="people">0명</span></li>
              <li>진행유형<span class="runningType">상품제공형</span></li>
              <li>카테고리<span class="runningCategory">뷰티</span></li>
            </ul>
          </div>
          <div class="stateCount">
            <div class="percentage recruitBar">
              <h4 class="stateTitle">모집현황</h4>
              <div class="stateBar recruit">
                <span class="percentageStick">0%</span>
              </div>
            </div>
            <div class="percentage shippingBar">
              <h4 class="stateTitle">제품발송</h4>
              <div class="stateBar shipping">
                <span class="percentageStick">0%</span>
              </div>
            </div>
            <div class="percentage posting">
              <h4 class="stateTitle">포스팅현황</h4>
              <div class="stateBar postingCheck">
                <p class="postingCount">
                  완료<span class="finish">0명</span> | 예정
                  <span class="ready">0명</span>
                </p>
              </div>
            </div>
          </div>
        </div>

        <div class="historyList">
          <div class="btnGroup">
            <div class="upAndDown">
              <button type="button" class="ExperienceBtn download">
                다운로드
              </button>
              <input
                type="file"
                class="ExperienceBtn"
                id="fileUpload"
                name="fileUpload"
              />
            </div>
            <div class="saveData">
              <button type="button" class="ExperienceBtn saveData">
                저장하기
              </button>
            </div>
          </div>

          <table class="ListTable historyTable">
            <thead class="historyColumn columnLine">
              <tr>
                <th>블로거명</th>
                <th>지수</th>
                <th>이름</th>
                <th>전화번호</th>
                <th>주소</th>
                <th>택배사</th>
                <th>송장번호</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody class="historyRow rowBox" id="deliveryTableBody">
              <!-- JS에서 동적 생성 -->
            </tbody>
          </table>
          <div id="page"></div>
        </div>
      </div>

      <div id="toast" class="toast"></div>
    </section>

    <!-- 푸터 -->
    <div id="footer"></div>

    <!-- JS -->
    <script src="js/include.js"></script>
    <script src="js/campaign-detail.js"></script>
  </body>
</html>
