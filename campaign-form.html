<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠페인 진행 현황</title>
    <link rel="stylesheet" href="./css/campaign-form.css">
</head>
<body>
    <div class="header">슈퍼링크 캠페인 진행 현황</div>
    <div class="nav">
        <a href="#" class="active">진행 현황</a>
        <a href="#">블로그 모집 신청</a>
        <a href="#">마이페이지</a>
    </div>
    
    <div class="container">
        <h2>A브랜드 | 신상품 체험단</h2>
        <p class="status">캠페인 진행중 | 2025.02.15 ~ 2025.02.28</p>
        
        <h3>모집 현황</h3>
        <div class="progress">
            <div class="progress-bar" style="width: 70%;"></div>
        </div>
        <p>10 / 20 (70%) 모집 완료</p>
        
        <h3>제품 발송</h3>
        <div class="progress">
            <div class="progress-bar" style="width: 40%;"></div>
        </div>
        <p>8 / 20 (40%) 발송 완료</p>
        
        <h3>포스팅 현황</h3>
        <p>포스팅 완료: 3명</p>
        <p>포스팅 예정: 7명</p>
        
        <button class="btn">다운로드</button>
        <button class="btn">송장 업로드</button>
    </div>
</body>
</html>
