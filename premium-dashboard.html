<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈퍼링크 대시보드</title>
    <link rel="stylesheet" href="./css/premium-dashboard.css">
</head>
<body>
    <div class="sidebar">
        <h1>슈퍼링크</h1>
        <a href="#" class="active">📊 대시보드</a>
        <a href="#">📝 블로그 모집 신청</a>
        <a href="#">📈 진행 현황</a>
        <a href="#">📊 데이터 분석</a>
        <a href="#">⚙️ 설정</a>
    </div>
    <div class="main-content">
        <div class="header">
            <h2>대시보드</h2>
            <input type="text" placeholder="검색..." style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
        </div>
        <div class="stats">
            <div class="card">
                <h3>진행 중인 캠페인</h3>
                <p>5</p>
            </div>
            <div class="card">
                <h3>모집 블로거</h3>
                <p>42</p>
            </div>
            <div class="card">
                <h3>완료된 포스팅</h3>
                <p>28</p>
            </div>
            <div class="card" style="background: #0A2540; color: #D4AF37;">
                <h3>평균 키워드 순위</h3>
                <p>3.2</p>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2025 슈퍼링크. 모든 권리 보유.</p>
        </div>
    </div>
</body>
</html>
